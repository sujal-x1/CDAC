<head>

<body>
    <script>
        obj={
            fname:"Raj",
            Iname:"Mathur",
            age:25,
            add:{d:"juhu"},

            {
                return this.fname+" "+this.Iname;

        document.write(obj)
        document.write(obj.toString());
