<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <script type="text/javascript">

        function setStyle() {
            document.getElementById("fname").style.background = "yellow";
        }

        function change() {
            document.getElementById("fname").style.color = "blue";
        }

    </script>

    First name:
    <input type="text"
           id="fname"
           onfocus="setStyle()"
           onblur="change()">

</body>
</html>
