<html>
<script type="text/javascript">
var i="5.5"


document.write("value of i is--"+i.valueOf()+"<br/>")

var b=5.5

var vi=i.valueOf()
var vb=b.valueOf()
var ans=vi+vb
document.write(ans)
document.write("<br/>")
if(vi==vb)
{

document.write("same")
}
else
{
document.write("different")
}

</script>
<body>
<p>
The valueOf() method returns the primitive value of a String object.

The primitive value is inherited by all objects descended from the String object.

The valueOf() method is usually called automatically by JavaScript behind the scenes and not explicitly in code.

<p>
</body>
