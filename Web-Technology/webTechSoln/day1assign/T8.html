<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        "use strict"
        function isSame(a,b){
            if (a===b){
                document.write("is same value and type")
            }
            else if(a==b){
                document.write("is same value")

            }
            else{
                document.write("not same type or value")
            }
        }
        isSame("5","5")
    </script>
</body>
