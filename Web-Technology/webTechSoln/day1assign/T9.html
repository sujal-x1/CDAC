<body>
    <script>
        "use strict"
        function addAll(...args){
            let sum=0;
             for(let i=0;i<args.length;i++){
                sum+=args[i]
             }
             return sum
        }
        document.write(addAll(7,5,3,2,1,7,8,6,2,1,5,5,4,1,2,5,8,4,4,))
    </script>
