<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <script>
        function TwoSquare(a,b){
            if(arguments.length==1){
            return a*a ;
            } else if(arguments.length==2){
                return a*b;
            }
        }

        document.write(TwoSquare(6));
        document.write("<br/>");
        document.write(TwoSquare(6,3));
        

    </script>
</body>
