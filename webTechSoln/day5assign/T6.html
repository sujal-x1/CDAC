<!-- 6. Create a web page for entering all personal details Information
  should containName, Date of Birth (use select drop down list),
   Gender, Address, Ps. No. , batch No. and Date of Joining (use select
    drop down list) Validate this form -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script>
        function validate() {

            var name = document.getElementById("t1").value;
            var dob = document.getElementById("t2").value;
            var psno = document.getElementById("t3").value;
            var address = document.getElementById("t4").value;
            var gender = document.getElementById("s1").value;
            var batch = document.getElementById("t5").value;

            var joinDay = document.getElementById("s2").value;
            var joinMonth = document.getElementById("s3").value;
            var joinYear = document.getElementById("s4").value;


            if (name == "") {
                alert("Please enter your name");
                return false;
            }

            if (dob == "") {
                alert("Please select your date of birth");
                return false;
            }

            if (psno == "") {
                alert("Please enter your PS No.");
                return false;
            }

            if (address == "") {
                alert("Please enter your address");
                return false;
            }

            if (gender == "") {
                alert("Please select your gender");
                return false;
            }

            if (batch == "") {
                alert("Please enter your batch number");
                return false;
            }

            if (joinDay == "" || joinMonth == "" || joinYear == "") {
                alert("Please select your date of joining");
                return false;
            }

            alert("Form submitted successfully!");
            return true;
        }
    </script>

</head>

<body>

    <form onsubmit="return validate()">

        <label for="t1">Name:</label>
        <input type="text" id="t1" required>
        <br><br>


        <!-- DOB kept as you had it -->
        <label for="t2">D.o.b : </label>
        <input type="date" id="t2" required>
        <br><br>


        <!-- PS No. -->
        <label for="t3">Ps. No.:</label>
        <input type="text" id="t3" required>
        <br><br>


        <label for="t4">Address:</label>
        <textarea id="t4" required></textarea>
        <br><br>


        <label for="s1">Gender:</label>

        <select id="s1" required>
            <option value="">Select Gender</option>
            <option>Male</option>
            <option>Female</option>
        </select>

        <br><br>


        <label for="t5">batch no :</label>
        <input type="text" id="t5" required>

        <br><br>


        <!-- Date of Joining -->
        <label for="s2">Date of Joining:</label>

        <select id="s2" required>
            <option value="">Day</option>
            <option>1</option>
            <option>2</option>
            <option>3</option>
            <option>4</option>
            <option>5</option>
            <option>6</option>
            <option>7</option>
            <option>8</option>
            <option>9</option>
            <option>10</option>
            <option>11</option>
            <option>12</option>
            <option>13</option>
            <option>14</option>
            <option>15</option>
            <option>16</option>
            <option>17</option>
            <option>18</option>
            <option>19</option>
            <option>20</option>
            <option>21</option>
            <option>22</option>
            <option>23</option>
            <option>24</option>
            <option>25</option>
            <option>26</option>
            <option>27</option>
            <option>28</option>
            <option>29</option>
            <option>30</option>
            <option>31</option>
        </select>


        <select id="s3" required>
            <option value="">Month</option>
            <option>January</option>
            <option>February</option>
            <option>March</option>
            <option>April</option>
            <option>May</option>
            <option>June</option>
            <option>July</option>
            <option>August</option>
            <option>September</option>
            <option>October</option>
            <option>November</option>
            <option>December</option>
        </select>


        <select id="s4" required>
            <option value="">Year</option>
            <option>2020</option>
            <option>2021</option>
            <option>2022</option>
            <option>2023</option>
            <option>2024</option>
            <option>2025</option>
            <option>2026</option>
        </select>

        <br><br>


        <button type="submit">submit :)</button>

    </form>

</body>
</html>
