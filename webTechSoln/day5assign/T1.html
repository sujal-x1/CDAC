<!DOCTYPE html>
<html>
<head>
    <title>Arithmetic Operation</title>

    <script>
        function calculate() {
            var num1 = document.getElementById("n1").value;
            var num2 = document.getElementById("n2").value;

            // Basic Validation
            if (num1 == "" || num2 == "") {
                alert("Please enter both numbers.");
                return;
            }

            num1 = parseFloat(num1);
            num2 = parseFloat(num2);

            var result;

            if (document.getElementById("add").checked) {
                result = num1 + num2;
            }
            else if (document.getElementById("mul").checked) {
                result = num1 * num2;
            }
            else {
                alert("Please select an operation.");
                return;
            }

            document.getElementById("result").value = result;
        }
    </script>
</head>

<body>

<h2>Arithmetic Operations</h2>

<form>

    Number 1:
    <input type="text" id="n1"><br><br>

    Number 2:
    <input type="text" id="n2"><br><br>

    <input type="radio" id="add" name="op" onclick="calculate()">
    <label for="add">+</label>

    <input type="radio" id="mul" name="op" onclick="calculate()">
    <label for="mul">*</label>

    <br><br>

    Result:
    <input type="text" id="result" readonly>

</form>

</body>
</html>
