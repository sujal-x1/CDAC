<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    Address
    <textarea id="t1" ></textarea><br><br>
    <input type="checkbox" id="chk" onclick="Validate()">
    <br><br>
    Temp Add
    <textarea id="t2"></textarea><br><br>
    <br><br>
    <button type="submit" onclick="Check()">submit</button>
    <br>
    <button type="reset">reset</button>

</body>
<script>
    function Validate(){
        let add= document.getElementById("t1")
        let temp = document.getElementById("t2")

        let checkbox =document.getElementById("chk")
        if(checkbox.checked){
            temp.value = add.value
        }
        else if(!checkbox.checked){
            temp.value = ""
        }
    }
    function Check(){
        let add= document.getElementById("t1")
        let temp = document.getElementById("t2")

        if(add.value.length<15 || temp.value.length<15){
            alert("invalid address")
        }

    }
</script>
</html>
