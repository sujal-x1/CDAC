<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>copy Address</title>
</head>
    <!-- Create 2 text areas and 1 checkbox. On clicking the checkbox, copy the address from one text area to another. -->
<body>
    <label>Address</label>
    <input type="text" id="T1" size="40"></input>
    <br>
    <input type="text" id="T2"  size="40"></input>
    <br>
    <input type="checkbox" id="checkbox" onclick="Copi()"></input>
    <script>
        function Copi(){
            let T1=document.getElementById("T1")
            let T2=document.getElementById("T2")
            let checkbox = document.getElementById("checkbox")

            if(checkbox.checked){
                T2.value=T1.value
            }
            if(checkbox.unchecked){
                T2.value=""
            }
            
            
        }
    </script>
    
    
</body>
</html>
