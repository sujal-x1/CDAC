    <h1>Gotta Fetch em all!</h1>

    <button onclick="FetchAll()">Fetch All</button>
    <script>
        async function FetchAll(){
        let response = await fetch("./ejson.json")
        if(response.ok){
        let data = await response.json();

        }
    }
    </script>
