<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>passwordvalidation</title>
</head>
<body>
    <form onsubmit="return validatePassword(event)">
        Password:
        <input type="password" id="pass" minlength="8" maxlength="15" required>
        <br><br>

        Re-enter Password:
        <input type="password" id="confirm" minlength="8" maxlength="15"  required>
        <br>

        <p id="msg"></p>
        <input type="submit">
        <button type="reset">Reset</button>
    </form>

    <script>


        function validatePassword(event){
            let p1=document.getElementById("pass").value
            let p2=document.getElementById("confirm").value

            const payload={}
            payload.password=p1;
            payload.pass=p2;
            console.log(payload)

            if(p1.length<8 || p1.length>15){
                alert("password length must be 8-15")
                return false;
            }
            if(p1!=p2){
                alert("Passwords do not match")
                return false;
            }
            else{
                alert("password validated")
                return true;
            }
            function clearMessage(){
                document.getElementById("msg").innerHTML="";
            }
        }
    </script>
    
</body>
</html>
