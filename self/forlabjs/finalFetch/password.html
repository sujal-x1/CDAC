<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text" onchange="check()" id="pass" />
    <script>
        function check() {
            let pass = document.getElementById("pass").value;
            console.log(pass)
           
            if (!/^[0-9A-Za-z]{4,8}$/.test(pass) || !/\d/.test(pass)|| pass==pass.toLowerCase() || pass==pass.toUpperCase() ) {
                alert("password is not correct")
            }
        }
        // /\d/.test(pass) --> \d checks if it contains digits 
        // Email basic validation
        // /^[0-9A-Za-z] +@[0-9A-Za-z] +\.[0-9A-Za-z]+$/

    </script>
</body>
</html>
