<!DOCTYPE html>
  <html> <body>    <h2>The XMLHttpRequest Object</h2>
         <p id="demo"></p>
      <form>
          <label>firstName</label><input name="firstname" />
          <label>lastname</label><input name="lastname" />
         <button type="button" onclick="fetchdata();">Send Form data </button>
     </form>
          <p id="p"></p>
    <script>
        fetchdata= async function(){
        var  form  =  document.querySelector('form');
        var object = {};
        form=new FormData(form);
                  console.log(form)
        form.forEach(function(value, key){
        object[key] = value;//  firstname="vita", lastname="vita@gmail.com"
                });
var json = JSON.stringify(object); 
 console.log(json);
    let  response  =  await  fetch("http://localhost:8081/person",
        {  method:"post",
           headers:   {
                  'Content-Type':   'application/json;charset=utf-8'
            },
        body:json
        }
    );
    if  (response.ok)  {  //  if  HTTP-status  is  200-299
    let x  = await  response.json();           
    document.getElementById('p').innerHTML= JSON.stringify(x);
        }       
       else  
           alert("HTTP-Error:  "  +  response.status);                 
            }
   </script>
 </body>
